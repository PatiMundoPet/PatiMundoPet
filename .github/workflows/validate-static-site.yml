name: Validate static site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: npm run build

      - name: Verify generated site is synchronized
        run: git diff --exit-code -- index.html privacy.html robots.txt assets/css/tailwind.min.css

      - name: Upload generated Tailwind CSS
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-generated-css
          path: assets/css/tailwind.min.css
          retention-days: 1

      - name: Verify compiled CSS is synchronized
        run: git diff --exit-code -- assets/css/tailwind.min.css

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/boot.js
          node --check assets/js/main.js
          node --check assets/js/scheduling-api.js
          node --check assets/js/scheduling.js
          node --check scripts/test-scheduling-api.mjs
          node --check scripts/build-site.mjs
          node --check scripts/test-security.mjs
          node --check scripts/test-apps-script.mjs
          node --check scripts/test-admin-apps-script.mjs
          node --check scripts/test-quality.mjs
          cp apps-script/Code.gs /tmp/paty-mundopet-Code.js
          node --check /tmp/paty-mundopet-Code.js
          cp admin-apps-script/Code.gs /tmp/pati-mundopet-admin-Code.js
          node --check /tmp/pati-mundopet-admin-Code.js

      - name: Test Apps Script backend with local mocks
        run: npm run test:apps-script

      - name: Test scheduling client with local mocks
        run: npm run test:scheduling-api

      - name: Test static security guarantees
        run: npm run test:security

      - name: Test SEO, accessibility and performance guarantees
        run: npm run test:quality

      - name: Test private admin panel with local mocks
        run: npm run test:admin-apps-script

      - name: Parse index.html
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          for path in ("index.html", "privacy.html"):
              parser = HTMLParser()
              parser.feed(Path(path).read_text(encoding="utf-8"))
              parser.close()
              print(f"{path} parsed successfully")
          PY

      - name: Verify Tailwind CDN was removed
        run: '! grep -q "cdn\.tailwindcss\.com" index.html'

      - name: Verify runtime Tailwind configuration was removed
        run: test ! -e assets/js/tailwind-config.js

      - name: Verify compiled CSS exists
        run: test -s assets/css/tailwind.min.css

      - name: Verify live integration configuration and absence of private keys
        run: |
          node <<'NODE'
          const config = require('./content/integration.json');
          let webAppUrl;
          try {
            webAppUrl = new URL(config.webAppUrl);
          } catch {
            process.exit(1);
          }
          const valid = config.mode === 'live' &&
            config.webAppUrl.length > 0 &&
            webAppUrl.protocol === 'https:' &&
            webAppUrl.hostname === 'script.google.com' &&
            /^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(webAppUrl.pathname) &&
            webAppUrl.pathname.endsWith('/exec');
          if (!valid) process.exit(1);
          NODE
          private_key_prefix='BEGIN (RSA |EC |OPENSSH )?PRIVATE'
          private_key_suffix=' KEY'
          ! grep -R -I -E --exclude-dir=.git --exclude-dir=node_modules \
            "${private_key_prefix}${private_key_suffix}" .

      - name: Verify placeholders and unpublished SEO state
        run: |
          node <<'NODE'
          const site = require('./content/site.json');
          const validWhatsapp = /^\d{10,15}$/.test(site.whatsappNumber) &&
            site.whatsappNumber !== '5511999999999';
          const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(site.email) &&
            site.email !== 'contato@patymundopet.com.br';
          let validInstagram = false;
          try {
            const instagram = new URL(site.instagram);
            validInstagram = instagram.protocol === 'https:' &&
              instagram.hostname === 'www.instagram.com' &&
              instagram.pathname !== '/';
          } catch {}
          if (site.contactsConfigured !== true || !validWhatsapp || !validEmail || !validInstagram) {
            process.exit(1);
          }
          NODE
          node -e "const s=require('./content/seo.json'); if(s.indexingEnabled!==false||s.siteUrl!==''||s.socialImage!=='') process.exit(1)"
          test ! -e sitemap.xml

      - name: Check whitespace errors
        run: git diff --check
