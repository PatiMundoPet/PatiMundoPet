name: Validate static site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: npm run build

      - name: Verify generated HTML is synchronized
        run: git diff --exit-code -- index.html

      - name: Upload generated Tailwind CSS
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-generated-css
          path: assets/css/tailwind.min.css
          retention-days: 1

      - name: Verify compiled CSS is synchronized
        run: git diff --exit-code -- assets/css/tailwind.min.css

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/scheduling-api.js
          node --check assets/js/scheduling.js
          node --check scripts/test-scheduling-api.mjs
          node --check scripts/test-apps-script.mjs
          cp apps-script/Code.gs /tmp/paty-mundopet-Code.js
          node --check /tmp/paty-mundopet-Code.js

      - name: Test Apps Script backend with local mocks
        run: npm run test:apps-script

      - name: Test scheduling client with local mocks
        run: npm run test:scheduling-api

      - name: Parse index.html
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          parser = HTMLParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          parser.close()
          print("index.html parsed successfully")
          PY

      - name: Verify Tailwind CDN was removed
        run: '! grep -q "cdn\.tailwindcss\.com" index.html'

      - name: Verify runtime Tailwind configuration was removed
        run: test ! -e assets/js/tailwind-config.js

      - name: Verify compiled CSS exists
        run: test -s assets/css/tailwind.min.css

      - name: Check whitespace errors
        run: git diff --check
