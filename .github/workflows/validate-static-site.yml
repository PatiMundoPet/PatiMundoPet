name: Validate static site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: npm run build

      - name: Verify generated site is synchronized
        run: git diff --exit-code -- index.html privacy.html robots.txt assets/css/tailwind.min.css

      - name: Upload generated Tailwind CSS
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-generated-css
          path: assets/css/tailwind.min.css
          retention-days: 1

      - name: Verify compiled CSS is synchronized
        run: git diff --exit-code -- assets/css/tailwind.min.css

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/boot.js
          node --check assets/js/main.js
          node --check assets/js/scheduling-api.js
          node --check assets/js/scheduling.js
          node --check scripts/test-scheduling-api.mjs
          node --check scripts/build-site.mjs
          node --check scripts/test-security.mjs
          node --check scripts/test-apps-script.mjs
          node --check scripts/test-quality.mjs
          cp apps-script/Code.gs /tmp/paty-mundopet-Code.js
          node --check /tmp/paty-mundopet-Code.js

      - name: Test Apps Script backend with local mocks
        run: npm run test:apps-script

      - name: Test scheduling client with local mocks
        run: npm run test:scheduling-api

      - name: Test static security guarantees
        run: npm run test:security

      - name: Test SEO, accessibility and performance guarantees
        run: npm run test:quality

      - name: Parse index.html
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          for path in ("index.html", "privacy.html"):
              parser = HTMLParser()
              parser.feed(Path(path).read_text(encoding="utf-8"))
              parser.close()
              print(f"{path} parsed successfully")
          PY

      - name: Verify Tailwind CDN was removed
        run: '! grep -q "cdn\.tailwindcss\.com" index.html'

      - name: Verify runtime Tailwind configuration was removed
        run: test ! -e assets/js/tailwind-config.js

      - name: Verify compiled CSS exists
        run: test -s assets/css/tailwind.min.css

      - name: Verify safe mode and absence of real integration values
        run: |
          node -e "const c=require('./content/integration.json'); if(c.mode!=='demo'||c.webAppUrl!=='') process.exit(1)"
          web_app_prefix='script\.google\.com/macros/s/'
          web_app_suffix='[A-Za-z0-9_-]{20,}/exec'
          private_key_prefix='BEGIN (RSA |EC |OPENSSH )?PRIVATE'
          private_key_suffix=' KEY'
          ! rg -g '!/.git/**' -e "${web_app_prefix}${web_app_suffix}|${private_key_prefix}${private_key_suffix}" .

      - name: Verify placeholders and unpublished SEO state
        run: |
          node -e "const s=require('./content/site.json'); if(s.contactsConfigured!==false) process.exit(1)"
          node -e "const s=require('./content/seo.json'); if(s.indexingEnabled!==false||s.siteUrl!==''||s.socialImage!=='') process.exit(1)"
          test ! -e sitemap.xml

      - name: Check whitespace errors
        run: git diff --check
