<script>
(function () {
  'use strict';
  var state = { requests: [], clients: [], payments: [], summary: {}, settings: null, today: '', agendaMode: 'dia', modalOpener: null, writesConfigured: false, writing: false };
  var $ = function (id) { return document.getElementById(id); };

  function rpc(name, args) {

      var runner = google.script.run.withSuccessHandler(function (response) {
        if (response && response.ok) resolve(response.data); else reject(new Error('READ_ERROR: Resposta inválida.'));

  function text(value, fallback) { return value === null || value === undefined || value === '' ? (fallback || '—') : String(value); }

  function clear(node) { node.replaceChildren(); }

  function formatDate(value) { if (!value) return '—'; var parts = value.slice(0, 10).split('-'); return parts.length === 3 ? parts[2] + '/' + parts[1] + '/' + parts[0] : text(value); }
  function formatDateTime(value) { return value ? formatDate(value) + (value.length > 10 ? ' · ' + value.slice(11, 16) : '') : '—'; }
  function badge(status) { var node = el('span', 'badge ' + (status || ''), text(status, 'Não informado').replaceAll('_', ' ')); return node; }
  function searchable(values, query) { var normalized = values.join(' ').toLocaleLowerCase('pt-BR'); return normalized.indexOf(query.toLocaleLowerCase('pt-BR')) >= 0; }
  function setNotice(node, message, kind) { node.textContent = message; node.className = 'notice ' + (kind || ''); node.hidden = false; }
  function hideNotice(node) { node.hidden = true; }
  function errorKind(error) { var message = String(error && error.message || error || ''), messages = { ACCESS_DENIED: 'Acesso negado. Entre com a conta autorizada.', CONFIG_ERROR: 'A configuração privada do painel precisa ser revisada.', INVALID_REQUEST: 'Revise os dados informados para esta ação.', INVALID_TRANSITION: 'Esta ação não é permitida para o status atual.', INVALID_INTERVAL: 'A data ou o horário da solicitação é inválido.', INTERVAL_UNAVAILABLE: 'O horário foi ocupado ou bloqueado. Recarregue os dados e escolha outro período.', LOCK_TIMEOUT: 'O painel está ocupado. Aguarde e tente novamente.', RECONCILIATION_REQUIRED: 'A solicitação precisa de revisão manual. Não repita esta ação.', PERSISTENCE_FAILED: 'Não foi possível salvar a alteração. A ação não foi concluída.', WRITE_ERROR: 'Não foi possível concluir a ação. Os dados atuais foram preservados.', NOT_FOUND: 'A solicitação não foi encontrada. Recarregue o painel.' }; var code = Object.keys(messages).find(function (item) { return message.indexOf(item) >= 0; }); return code ? messages[code] : 'Não foi possível concluir a operação agora. Tente novamente.'; }

  function loadInitial() {

      renderAll();

  function renderAll() {

  }

  function eventCard(event, className) {

    main.append(el('strong', '', text(event.title, event.type === 'bloqueio' ? 'Indisponível' : 'Atendimento')),
      el('span', '', event.allDay ? formatDate(event.start) + ' · dia inteiro' : formatDateTime(event.start) + ' até ' + event.end.slice(11, 16)));

  function renderDashboard() { var list = $('dashboardAgenda'); clear(list); if (!state.summary.agenda.length) return empty(list, 'Nenhum atendimento nos próximos 7 dias.'); state.summary.agenda.forEach(function (event) { list.appendChild(eventCard(event)); }); }

  function renderRequests() {
    var query = $('requestSearch').value.trim(), status = $('requestStatus').value, rows = state.requests.filter(function (row) { return (status === 'TODOS' || row.status === status) && (!query || searchable([row.responsible, row.pet, row.service, row.region, row.requestId], query)); });
    var list = $('requestList'); clear(list); if (!rows.length) return empty(list, state.requests.length ? 'Nenhuma solicitação corresponde aos filtros.' : 'Nenhuma solicitação encontrada.');

      var meta = el('div', 'meta'); meta.append(el('span', '', formatDate(row.date) + ' · ' + text(row.time) + (row.endTime ? '–' + row.endTime : '')), el('span', '', text(row.region))); card.append(main, meta, badge(row.status));
      function open() { openRequest(row, card); } card.addEventListener('click', open); card.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } }); list.appendChild(card);
    });
  }

  function details(fields) { var dl = el('dl', 'detail'); fields.forEach(function (field) { var box = el('div'); box.append(el('dt', '', field[0]), el('dd', '', text(field[1]))); dl.appendChild(box); }); return dl; }
  function openRequest(row, opener) {

    addContactButtons(row.whatsapp, row.email);
    var actions = row.status === 'PENDENTE' ? [['Confirmar','confirmarSolicitacao',false],['Pedir mais informações','pedirMaisInformacoes',true],['Recusar','recusarSolicitacao',true],['Cancelar','cancelarSolicitacao',false]] : row.status === 'MAIS_INFORMACOES' ? [['Confirmar','confirmarSolicitacao',false],['Voltar para pendente','voltarSolicitacaoParaPendente',false],['Recusar','recusarSolicitacao',true],['Cancelar','cancelarSolicitacao',false]] : row.status === 'CONFIRMADO' ? [['Cancelar','cancelarSolicitacao',false]] : [];
    actions.forEach(function (action) { var button = el('button', 'btn btn-outline', action[0]); button.disabled = !state.writesConfigured; button.addEventListener('click', function () { showAction(row, action); }); $('modalFoot').appendChild(button); });
    if (!state.writesConfigured && actions.length) $('modalBody').appendChild(el('p', 'notice', 'Ações indisponíveis: configuração administrativa pendente.'));
  }


  function showAction(row, action) {
    if (state.writing || $('modalBody').querySelector('.action-panel')) return;
    var area = el('section', 'action-panel'); area.setAttribute('aria-labelledby', 'modalActionTitle');
    var title = el('h3', '', action[0]); title.id = 'modalActionTitle'; area.append(title, el('p', '', 'A alteração só será aplicada após confirmação e releitura segura no servidor.'));
    var input = null; if (action[1] !== 'confirmarSolicitacao') { var label = el('label', '', 'Observação administrativa' + (action[2] ? ' (obrigatória)' : ' (opcional)')); input = document.createElement('textarea'); input.maxLength = 500; input.rows = 4; input.required = action[2]; label.appendChild(input); area.appendChild(label); }
    var controls = el('div', 'modal-actions'), back = el('button', 'btn btn-outline', 'Desistir'), confirm = el('button', 'btn btn-primary', 'Confirmar ação'); controls.append(back, confirm); area.appendChild(controls); $('modalBody').appendChild(area); (input || confirm).focus();
    back.onclick = function () { area.remove(); };
    confirm.onclick = function () { if (state.writing || action[2] && !input.value.trim()) { (input || confirm).focus(); return; } state.writing = true; $('modalBackdrop').setAttribute('aria-busy', 'true'); area.classList.add('processing'); Array.from($('modalBackdrop').querySelectorAll('button,textarea')).forEach(function (control) { control.disabled = true; }); confirm.textContent = 'Processando…'; rpc(action[1], action[1] === 'confirmarSolicitacao' ? [row.requestId] : [row.requestId, input ? input.value : '']).then(refreshAfterWrite).then(function () { state.writing = false; $('modalBackdrop').removeAttribute('aria-busy'); closeModal(); setNotice($('globalNotice'), 'Ação concluída com segurança.', 'success'); }).catch(function (error) { state.writing = false; $('modalBackdrop').removeAttribute('aria-busy'); area.classList.remove('processing'); setNotice($('globalNotice'), errorKind(error), 'error'); Array.from($('modalBackdrop').querySelectorAll('button,textarea')).forEach(function (control) { control.disabled = false; }); confirm.textContent = 'Confirmar ação'; }); };
  }

  function refreshAfterWrite() {
    var agendaDate = $('agendaDate').value, blockStart = $('blockStart').value, blockEnd = $('blockEnd').value;
    return rpc('carregarDadosIniciais').then(function (data) { Object.assign(state, data); $('agendaDate').value = agendaDate || state.today; $('blockStart').value = blockStart || state.today; $('blockEnd').value = blockEnd || addDays(state.today, 30); renderAll(); var jobs = []; if (!document.getElementById('view-agenda').hidden) jobs.push(loadAgenda()); if (!document.getElementById('view-bloqueios').hidden || $('blockList').children.length) jobs.push(loadBlocks()); return Promise.all(jobs); });
  }

  function renderClients() {
    var query = $('clientSearch').value.trim(), rows = state.clients.filter(function (row) { return !query || searchable([row.responsible, row.pets, row.email, row.whatsapp], query); });
    var list = $('clientList'); clear(list); if (!rows.length) return empty(list, state.clients.length ? 'Nenhum cliente corresponde à busca.' : 'Nenhum cliente encontrado.');
    rows.forEach(function (row) { var card = el('article', 'item-card clickable'); card.tabIndex = 0; card.setAttribute('role', 'button'); var main = el('div', 'item-main'); main.append(el('strong', '', text(row.responsible)), el('span', '', 'Pets: ' + text(row.pets))); card.append(main, el('span', 'meta', 'Último atendimento: ' + formatDateTime(row.lastAppointment))); function open() { openClient(row, card); } card.onclick = open; card.onkeydown = function (event) { if (event.key === 'Enter') open(); }; list.appendChild(card); });
  }
  function openClient(row, opener) { openModal('Cliente', details([['Responsável', row.responsible], ['WhatsApp', row.whatsapp], ['E-mail', row.email], ['Pets', row.pets], ['Observações', row.notes], ['Cadastro', formatDateTime(row.registeredAt)], ['Último atendimento', formatDateTime(row.lastAppointment)]]), opener); addContactButtons(row.whatsapp, row.email); ['Editar', 'Adicionar pet', 'Criar atendimento', 'Criar recorrência'].forEach(function (label) { var button = el('button', 'btn btn-outline', label + ' · próxima fase'); button.disabled = true; $('modalFoot').appendChild(button); }); }

  function renderPayments() {
    var query = $('paymentSearch').value.trim(), status = $('paymentStatus').value, rows = state.payments.filter(function (row) { return (status === 'TODOS' || row.status === status) && (!query || searchable([row.client, row.requestId, row.service], query)); });
    var list = $('paymentList'); clear(list); if (!rows.length) return empty(list, state.payments.length ? 'Nenhum pagamento corresponde aos filtros.' : 'Nenhum pagamento encontrado.');
    rows.forEach(function (row) { var card = el('article', 'item-card'); var main = el('div', 'item-main'); var amount = row.amount === null ? 'Valor não informado' : Number(row.amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); main.append(el('strong', '', text(row.client)), el('span', '', text(row.service) + ' · solicitação ' + text(row.requestId))); var meta = el('div', 'meta'); meta.append(el('span', '', amount), el('span', '', text(row.paymentMethod)), el('span', '', 'Vencimento: ' + formatDate(row.dueDate)), el('span', '', 'Pagamento: ' + formatDateTime(row.paidAt)), el('span', '', 'Observações: ' + text(row.notes))); card.append(main, meta, badge(row.status)); list.appendChild(card); });
  }

  function loadAgenda() {
    var date = $('agendaDate').value; if (!date) return;
    setNotice($('agendaNotice'), 'Carregando agenda real…', 'loading'); empty($('agendaGrid'), 'Carregando…');
    var method = state.agendaMode === 'dia' ? 'consultarAgendaDia' : 'consultarAgendaSemana';
    return rpc(method, [date]).then(function (data) { hideNotice($('agendaNotice')); renderAgenda(data); }).catch(function (error) { setNotice($('agendaNotice'), errorKind(error), 'error'); empty($('agendaGrid'), 'A agenda não pôde ser carregada.'); });
  }
  function eventOverlapsPeriod(event, periodStart, periodEnd) { return event.start < periodEnd && event.end > periodStart; }
  function renderAgenda(data) { if (state.agendaMode === 'semana') return renderWeek(data); var grid = $('agendaGrid'); clear(grid); var events = data.appointments.concat(data.blocks).sort(function(a,b){return a.start.localeCompare(b.start);}), allDay=events.filter(function(e){return e.allDay;}), timed=events.filter(function(e){return !e.allDay;}); if(allDay.length){grid.appendChild(el('h3','','Dia inteiro'));allDay.forEach(function(event){grid.appendChild(eventCard(event));});} if(timed.length){grid.appendChild(el('h3','','Horários'));timed.forEach(function(event){grid.appendChild(eventCard(event));});} if(!events.length) empty(grid,'Sem eventos neste dia.'); }
  function renderWeek(data) { var grid = $('agendaGrid'); clear(grid); grid.className = 'week-grid'; for (var offset = 0; offset < 7; offset += 1) { var date = addDays(data.range.start, offset), day = el('article', 'week-day'); day.appendChild(el('h3', '', formatDate(date))); var dayStart = date + 'T00:00:00', dayEnd = addDays(date, 1) + 'T00:00:00'; var events = data.appointments.concat(data.blocks).filter(function (event) { return eventOverlapsPeriod(event, dayStart, dayEnd); }).sort(function (a, b) { return a.start.localeCompare(b.start); }); if (!events.length) day.appendChild(el('p', 'meta', 'Sem eventos · disponibilidade padrão')); events.forEach(function (event) { day.appendChild(el('div', 'week-event', (event.allDay ? 'Dia inteiro' : event.start.slice(11, 16) + '–' + event.end.slice(11, 16)) + ' · ' + text(event.title, event.type === 'bloqueio' ? 'Indisponível' : 'Atendimento'))); }); grid.appendChild(day); } }
  function toMinutes(value) { var parts = value.split(':'); return Number(parts[0]) * 60 + Number(parts[1]); } function pad(value) { return String(value).padStart(2, '0'); }
  function addMinutes(dateTime, minutes) { var date = new Date(dateTime); date.setMinutes(date.getMinutes() + minutes); return localIso(date); } function localIso(date) { return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':00'; }
  function addDays(iso, amount) { var parts = iso.slice(0, 10).split('-').map(Number), date = new Date(parts[0], parts[1] - 1, parts[2] + amount); return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()); }

  function loadBlocks() { var start = $('blockStart').value, end = $('blockEnd').value; if (!start || !end || end < start) return empty($('blockList'), 'Informe um intervalo válido.'); empty($('blockList'), 'Carregando bloqueios reais…'); return rpc('listarBloqueios', [start, end]).then(renderBlocks).catch(function (error) { empty($('blockList'), errorKind(error)); }); }
  function renderBlocks(rows) { var list = $('blockList'); clear(list); if (!rows.length) return empty(list, 'Nenhum bloqueio encontrado no intervalo.'); rows.forEach(function (row) { var card = eventCard(row); var disabled = el('button', 'btn btn-outline', 'Editar · próxima fase'); disabled.disabled = true; card.appendChild(disabled); list.appendChild(card); }); }

  function validWhatsapp(value) { var digits = String(value || '').replace(/\D/g, ''); if (digits.length < 10 || digits.length > 13) return ''; if (digits.length <= 11) digits = '55' + digits; return digits; }
  function validEmail(value) { var email = String(value || '').trim(); return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? email : ''; }
  function addContactButtons(phone, email) { var number = validWhatsapp(phone), address = validEmail(email); if (number) { var whats = el('a', 'btn btn-outline', 'Abrir WhatsApp'); whats.href = 'https://wa.me/' + number; whats.target = '_blank'; whats.rel = 'noopener noreferrer'; $('modalFoot').appendChild(whats); } if (address) { var mail = el('a', 'btn btn-outline', 'Escrever e-mail'); mail.href = 'mailto:' + encodeURIComponent(address); $('modalFoot').appendChild(mail); } }

  function openModal(title, body, opener) { if (state.writing) return; state.modalOpener = opener || document.activeElement; $('modalTitle').textContent = title; clear($('modalBody')); $('modalBody').appendChild(body); clear($('modalFoot')); $('modalBackdrop').hidden = false; document.body.style.overflow = 'hidden'; $('modalClose').focus(); }
  function closeModal() { if (state.writing) return; $('modalBackdrop').hidden = true; document.body.style.overflow = ''; if (state.modalOpener) state.modalOpener.focus(); }
  function trapModal(event) { if ($('modalBackdrop').hidden) return; if (event.key === 'Escape') { if (!state.writing) closeModal(); return; } if (event.key !== 'Tab') return; var focusable = Array.from($('modalBackdrop').querySelectorAll('a[href],button:not([disabled]),input,select,textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')); if (!focusable.length) return; var first = focusable[0], last = focusable[focusable.length - 1]; if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); } else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); } }

  document.querySelectorAll('.nav-btn').forEach(function (button) { button.addEventListener('click', function () { var name = button.dataset.view; document.querySelectorAll('.view').forEach(function (view) { var active = view.id === 'view-' + name; view.hidden = !active; view.classList.toggle('active', active); }); document.querySelectorAll('.nav-btn').forEach(function (item) { var active = item === button; item.classList.toggle('active', active); if (active) item.setAttribute('aria-current', 'page'); else item.removeAttribute('aria-current'); }); closeDrawer(); $('view-' + name).querySelector('h1').focus({ preventScroll: true }); if (name === 'agenda') loadAgenda(); if (name === 'bloqueios' && !$('blockList').children.length) loadBlocks(); }); });
  function closeDrawer() { $('sidebar').classList.remove('open'); $('drawerOverlay').hidden = true; $('menuButton').setAttribute('aria-expanded', 'false'); }
  $('menuButton').onclick = function () { var open = !$('sidebar').classList.contains('open'); $('sidebar').classList.toggle('open', open); $('drawerOverlay').hidden = !open; $('menuButton').setAttribute('aria-expanded', String(open)); }; $('drawerOverlay').onclick = closeDrawer;
  $('reloadButton').onclick = loadInitial; $('requestSearch').oninput = renderRequests; $('requestStatus').onchange = renderRequests; $('clientSearch').oninput = renderClients; $('paymentSearch').oninput = renderPayments; $('paymentStatus').onchange = renderPayments;
  $('agendaDate').onchange = loadAgenda; $('agendaToday').onclick = function () { $('agendaDate').value = state.today; loadAgenda(); }; document.querySelectorAll('[data-agenda-mode]').forEach(function (button) { button.onclick = function () { state.agendaMode = button.dataset.agendaMode; document.querySelectorAll('[data-agenda-mode]').forEach(function (item) { var active = item === button; item.classList.toggle('active', active); item.setAttribute('aria-pressed', String(active)); }); $('agendaGrid').className = ''; loadAgenda(); }; }); $('loadBlocks').onclick = loadBlocks;
  $('modalClose').onclick = closeModal; $('modalBackdrop').onclick = function (event) { if (event.target === $('modalBackdrop')) closeModal(); }; document.addEventListener('keydown', trapModal);
  loadInitial();
}());
</script>
